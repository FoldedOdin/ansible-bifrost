---
- name: Bootstrap Python on minimal container images
  hosts: workstations
  gather_facts: false
  tasks:
    - name: Install Python and sudo on Arch Linux if missing
      ansible.builtin.raw: |
        if command -v pacman >/dev/null 2>&1 && ! command -v python3 >/dev/null 2>&1; then
          pacman -Sy --noconfirm python sudo
        fi
      changed_when: false

- name: Prepare container environment
  hosts: workstations
  become: true
  tasks:
    - name: Update pacman package database (Arch Linux)
      community.general.pacman:
        update_cache: true
      when: ansible_facts['os_family'] == "Archlinux"

    - name: Ensure archive utilities are installed for binary installers
      ansible.builtin.package:
        name:
          - tar
          - gzip
        state: present

    - name: Create mock workstation user
      ansible.builtin.user:
        name: testuser
        shell: /bin/bash
        create_home: true
