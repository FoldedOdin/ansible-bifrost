---
name: Cross-Distro Ansible CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: YAML & Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ansible-core ansible-lint yamllint

      - name: Install required Ansible Galaxy collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

      - name: Run Ansible syntax check
        run: ansible-playbook site.yml --syntax-check

  molecule-test:
    name: Molecule Matrix (${{ matrix.distro }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: geerlingguy/docker-fedora41-ansible:latest
            command: /usr/lib/systemd/systemd
          - distro: ubuntu
            image: geerlingguy/docker-ubuntu2404-ansible:latest
            command: /lib/systemd/systemd
          - distro: archlinux
            image: archlinux:latest
            command: /usr/lib/systemd/systemd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Molecule & Docker driver
        run: pip install ansible-core molecule "molecule-plugins[docker]"

      - name: Install required Ansible Galaxy collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run Molecule full test lifecycle
        env:
          MOLECULE_DISTRO_IMAGE: ${{ matrix.image }}
          MOLECULE_DOCKER_COMMAND: ${{ matrix.command }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
        run: molecule test
