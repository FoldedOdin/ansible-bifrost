pkg_wget: wget2-wget
# Container & Build Tooling
pkg_docker_engine: moby-engine
pkg_docker_compose: docker-compose
pkg_build_tools: "@development-tools"

# Service & Repo Metadata
docker_service_name: docker
enable_fedora_copr: true
fedora_copr_repos:
  - sdegler/hyprland
