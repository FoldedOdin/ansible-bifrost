[defaults]
inventory = inventories/vms/hosts.ini
forks = 10
gathering = smart
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml

[privilege_escalation]
become = True
become_user = root
become_method = sudo
become_ask_pass = True

[connection]
pipelining = False
